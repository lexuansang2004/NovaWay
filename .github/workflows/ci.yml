name: CI

# docs/TEST_STRATEGY.md §3 — "Mọi PR vào develop phải pass: lint, unit
# test, integration test." Merge vào `main` yêu cầu thêm "E2E suite pass
# trên môi trường staging" — job `e2e` dưới đây chạy suite thật
# (apps/web/e2e/golden-path.spec.ts) nhưng nhắm vào backend + Postgres/
# PostGIS được dựng ngay trong runner (service container), KHÔNG phải
# staging thật (Railway) — chạy trên staging thật là việc riêng, chưa
# làm ở đây (xem docs/roadmap/OPEN_ITEMS_AFTER_MVP.md §2).
on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  node:
    name: Backend + Web + shared-types (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # pnpm@11 requires Node >= 22.13 (found by this CI run itself —
          # node-version: 20 failed with ERR_UNKNOWN_BUILTIN_MODULE).
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/backend jest specs use mocked repositories (no live Postgres
      # needed, see docs/OBSERVABILITY.md / no *.e2e-spec.ts in the repo),
      # so no database service container is required for this job.
      - name: Lint
        run: pnpm -r --if-present lint

      # Build before test — apps/backend/apps/web import @novaway/shared-types,
      # which is only resolvable once its own `tsc` build has produced
      # dist/index.d.ts. `pnpm -r` builds in dependency (topological) order,
      # so this one invocation builds shared-types before backend/web need
      # it. Running test first (as this workflow originally did) failed with
      # "Cannot find module '@novaway/shared-types'" — found by this CI run.
      - name: Build
        run: pnpm -r --if-present build

      - name: Test
        run: pnpm -r --if-present test

  e2e:
    name: E2E (Playwright, golden path)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: novaway
          POSTGRES_PASSWORD: novaway
          POSTGRES_DB: novaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same ordering requirement as the `node` job — shared-types must
      # build before backend/web can resolve it.
      - name: Build
        run: pnpm -r --if-present build

      - name: Run backend migrations
        working-directory: apps/backend
        run: node ./node_modules/typeorm/cli-ts-node-commonjs.js -d src/database/data-source.ts migration:run
        env:
          DATABASE_URL: postgres://novaway:novaway@localhost:5432/novaway

      # docs/REVIEW_NOTES.md §17 — step 9.3 (fix/raw-gps-partition-availability).
      # Runs immediately after migrations, before the backend starts, so a
      # regression in ensure_raw_gps_partitions() (idempotency, current/next
      # UTC-month partition creation, concurrency, or the explicit-UTC bound
      # fix) fails the job here instead of surfacing later as a confusing
      # golden-path E2E failure.
      - name: Verify raw_gps_events partition maintenance
        working-directory: apps/backend
        run: pnpm test:partition-integration
        env:
          DATABASE_URL: postgres://novaway:novaway@localhost:5432/novaway

      # Backgrounded — persists for the rest of this job's steps on the
      # same runner. apps/web's Playwright config starts its own dev
      # server (webServer), but can't bootstrap a database, so the
      # backend has to be started here instead.
      - name: Start backend
        working-directory: apps/backend
        run: node dist/main.js > backend.log 2>&1 &
        env:
          PORT: 3000
          NODE_ENV: production
          DATABASE_URL: postgres://novaway:novaway@localhost:5432/novaway
          JWT_SECRET: ci-e2e-only-secret-not-used-anywhere-real
          JWT_EXPIRES_IN: 7d
          WEB_ORIGIN: http://localhost:5173
          ROUTING_PROVIDER: mock
          VERIFICATION_VALIDITY_MINUTES: 5

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not become healthy in time"
          cat apps/backend/backend.log
          exit 1

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: apps/web
        run: pnpm test:e2e

  mobile:
    name: Mobile (analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test
